[package]
name = "auto-subtitle"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    ".",
    "src-tauri"
]

[lib]
name = "auto_subtitle"
path = "src/lib.rs"

[[bin]]
name = "auto-subtitle"
path = "src/main.rs"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
anyhow = "1"
async-trait = "0.1"
dirs = "5"
regex = "1"
tempfile = "3.20"
which = "6"
whisper-rs = "0.16"
hound = "3.5"

[dev-dependencies]
wiremock = "0.6"
