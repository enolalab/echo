[package]
name = "auto-subtitle-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "auto_subtitle_desktop"
path = "src/lib.rs"

[[bin]]
name = "auto-subtitle-desktop"
path = "src/main.rs"

[dependencies]
auto-subtitle = { path = ".." }
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dirs = "5"
tempfile = "3.20"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
